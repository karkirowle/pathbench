[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathbench"
version = "0.1.0"
description = "A benchmarking framework for evaluating pathological speech assessment systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# TODO: fill in your real name and email address
authors = [
    {name = "Bence Mark Halpern", email = "halpernbence@gmail.com"},
]
keywords = [
    "speech",
    "pathology",
    "benchmark",
    "evaluation",
    "acoustic",
    "dysarthria",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies required by the pathbench package itself.
# NOTE: torch and torchaudio are listed with loose constraints.
# For GPU / specific CUDA support install them first following
# https://pytorch.org/get-started/locally/ before running pip install pathbench.
#
# System dependency (not pip-installable): espeak-ng shared library.
# Install via your OS package manager, e.g.: apt install espeak-ng
#
# Lower bounds are the oldest versions the unit tests pass with: the "lowest"
# CI job installs exactly these (uv --resolution lowest-direct) and checks the
# EXPECTED_* scores. torch/torchaudio>=2.1 is needed for
# torchaudio.functional.forced_align. Raise a bound rather than lower it
# without testing. constraints.txt pins the exact paper environment.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "dtw-python>=1.3",
    "jiwer>=3.0",
    # phonemizer 3.4.0 is the floor: it caches espeak backend instances across
    # phonemize() calls, which is what the phonemizer-fork pin provided, and it
    # makes the heavy "segments" dependency optional. Verified to phonemize all
    # 1932 dataset transcripts byte-identically to phonemizer-fork 3.3.2.
    "phonemizer>=3.4.0,<4",
    # 0.5.0 is the latest PyPI release. Verified to produce identical LM-decoded
    # transcriptions to the 0.6.0 development snapshot previously pinned from git.
    "pyctcdecode>=0.5.0",
    "praat-parselmouth>=0.4.4",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
# Extra dependencies used only by the scripts/ directory
scripts = [
    "matplotlib>=3.6",
    "pandas>=1.5",
    "tqdm>=4.60",
]
# Language-model CTC decoding, used by DoubleASR and ArtP-DoubleASR. kenlm
# publishes no wheels, so installing this extra compiles it from source and
# needs cmake and a C++ toolchain. Without it those two evaluators raise at
# decoder construction; every other metric works.
lm = [
    "kenlm>=0.3.0",
]
# Sphinx documentation generation
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "furo",
]
# Convenience meta-extra that pulls in everything
all = [
    "pathbench[scripts]",
    "pathbench[docs]",
    "pathbench[lm]",
]

[tool.setuptools.packages.find]
# Only include the pathbench package; ignore results_*, datasets/, scripts/, etc.
include = ["pathbench*"]

[project.urls]
Homepage = "https://github.com/karkirowle/pathbench"
Repository = "https://github.com/karkirowle/pathbench"
"Bug Tracker" = "https://github.com/karkirowle/pathbench/issues"
